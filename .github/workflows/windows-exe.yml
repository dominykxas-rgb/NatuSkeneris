name: Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}\engine;${{ github.workspace }}\app
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Paketai
        run: python -m pip install -r requirements.txt pyinstaller

      - name: homr variklis
        shell: pwsh
        run: |
          $c = (Get-Content homr-version.txt).Trim()
          Invoke-WebRequest "https://github.com/liebharc/homr/archive/$c.zip" -OutFile homr.zip
          Expand-Archive homr.zip -DestinationPath homr-src
          New-Item -ItemType Directory -Force engine | Out-Null
          Copy-Item "homr-src\homr-$c\homr" engine -Recurse
          Copy-Item "homr-src\homr-$c\LICENSE" engine\homr-LICENSE.txt

      - name: Atpažinimo modeliai
        run: python app/run_homr.py --init --no-title

      - name: Piktograma
        run: python app/make_icon.py

      - name: Testinės natos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test\variklis | Out-Null
          $base = "https://raw.githubusercontent.com/Audiveris/audiveris/master/data/examples"
          Invoke-WebRequest "$base/chula.png" -OutFile test\chula.png
          Copy-Item test\chula.png test\variklis\chula.png

      - name: Variklio patikra (be exe)
        timeout-minutes: 20
        run: python app/run_homr.py --no-title test/variklis/chula.png

      - name: Exe kūrimas
        run: pyinstaller Penkline.spec --noconfirm

      - name: Exe patikra su tikromis natomis
        timeout-minutes: 15
        shell: pwsh
        run: |
          $exe = "dist\Penkline\Penkline.exe"
          $out = "test\out-exe"
          $p = Start-Process $exe -ArgumentList "--selftest", "test\chula.png", $out -PassThru
          $null = $p.Handle  # be to PowerShell neparodo išėjimo kodo
          $start = Get-Date
          $shown = 0
          while (-not $p.HasExited -and ((Get-Date) - $start).TotalMinutes -lt 10) {
            Start-Sleep 10
            $log = Get-Content "$out\homr.log" -ErrorAction SilentlyContinue
            if ($log -and $log.Count -gt $shown) { $log[$shown..($log.Count - 1)]; $shown = $log.Count }
            Write-Host ("... {0:N0} s" -f ((Get-Date) - $start).TotalSeconds)
          }
          $hung = -not $p.HasExited
          if ($hung) {
            Write-Host "::error::Exe užstrigo (10 min)"
            Get-Process Penkline -ErrorAction SilentlyContinue | Format-Table Id, CPU, WS -AutoSize
            Get-Process Penkline -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          $logs = @(Get-ChildItem $out -Filter *.log -ErrorAction SilentlyContinue) +
                  @(Get-ChildItem "$env:LOCALAPPDATA\Penkline" -Filter *.log -ErrorAction SilentlyContinue)
          foreach ($f in $logs) {
            Write-Host "----- $($f.FullName) -----"
            Get-Content $f.FullName
          }
          if ($hung) { exit 1 }
          if ($p.ExitCode -ne 0) { Write-Host "::error::Exe patikra nepavyko (kodas $($p.ExitCode))"; exit 1 }

      - name: Rezultatų išsaugojimas (peržiūrai)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patikros-rezultatai
          path: test/
          if-no-files-found: ignore

      - name: Supakavimas
        shell: pwsh
        run: |
          Copy-Item SKAITYK.md dist\Penkline\
          Copy-Item engine\homr-LICENSE.txt dist\Penkline\
          Compress-Archive dist\Penkline Penkline-Windows.zip

      - name: Išleidimas (Releases → naujausia)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete naujausia --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create naujausia Penkline-Windows.zip `
            --title "Penklinė (Windows)" `
            --notes "Išarchyvuok ir paleisk Penkline.exe. Commit: ${{ github.sha }}" `
            --target ${{ github.sha }}
