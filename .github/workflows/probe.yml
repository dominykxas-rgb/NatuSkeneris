name: Bandymas
on:
  push:
    branches: [main]
    paths: ["probe/**", ".github/workflows/probe.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          npm init -y > /dev/null && npm i --no-audit --no-fund verovio > /dev/null
          ls node_modules/verovio/dist | head -30
          node probe/probe.mjs 2>&1 | tee probe/out.txt
          while IFS= read -r l; do echo "::notice title=probe::${l:0:3000}"; done < probe/out.txt
